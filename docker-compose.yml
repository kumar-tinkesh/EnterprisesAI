# ---------------------------------------------------------------------------
# EnterpriseAI — full local stack
#
#   docker compose up --build
#     web  -> http://localhost:3001/auth
#     auth -> http://localhost:8001/docs
#     backend -> http://localhost:8002/docs
#
# With PostgreSQL instead of SQLite:
#   docker compose --profile postgres up --build
#   (then set DATABASE_URL under `auth.environment` to the postgres URL below)
# ---------------------------------------------------------------------------
name: enterpriseai

services:
  # --- Auth service (FastAPI) ---------------------------------------------
  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth
    image: enterpriseai-auth
    container_name: enterpriseai-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      ENV: production
      DEBUG: "false"
      APP_NAME: EnterpriseAI Auth Service
      API_V1_PREFIX: /api/v1
      JWT_ISSUER: enterprise-ai-auth
      JWT_AUDIENCE: enterprise-ai
      # SQLite on a named volume by default; for Postgres use e.g.:
      # DATABASE_URL: postgresql+asyncpg://auth:auth@db:5432/auth
      DATABASE_URL: ${AUTH_DATABASE_URL:-sqlite+aiosqlite:////data/auth.db}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]'
      # Override secrets via .env at the repo root or your shell.
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:-change-me-in-production}
      SSO_PROVIDER: ${SSO_PROVIDER:-google}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_DISCOVERY_URL: ${SSO_DISCOVERY_URL:-https://accounts.google.com/.well-known/openid-configuration}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:3001/auth/callback}
    volumes:
      - ./data:/data                      # SQLite database file (host-accessible)
      - ./data/.keys:/app/apps/auth/.keys  # RSA keypair (keep across restarts)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)",
        ]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- Web frontend (Next.js) ----------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Must be reachable from the BROWSER, not from inside the network.
        NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    image: enterpriseai-web
    container_name: enterpriseai-web
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:-3001}
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    depends_on:
      auth:
        condition: service_healthy

  # --- Redis (cache, rate-limits, pub/sub) ----------------------------------
  redis:
    image: redis:7-alpine
    container_name: enterpriseai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  # --- LLM Gateway (unified LLM proxy) -------------------------------------
  llm-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm_gateway
    image: enterpriseai-llm-gateway
    container_name: enterpriseai-llm-gateway
    restart: unless-stopped
    ports:
      - "${LLM_GATEWAY_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      # Provider API keys — set in .env at repo root
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Defaults
      LLM_GATEWAY_DEFAULT_PROVIDER: ${LLM_GATEWAY_DEFAULT_PROVIDER:-openai}
      LLM_GATEWAY_EMBEDDING_PROVIDER: ${LLM_GATEWAY_EMBEDDING_PROVIDER:-gemini}
      LLM_GATEWAY_TIMEOUT: ${LLM_GATEWAY_TIMEOUT:-60}
      LLM_GATEWAY_MAX_RETRIES: ${LLM_GATEWAY_MAX_RETRIES:-3}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
      GROQ_DEFAULT_MODEL: ${GROQ_DEFAULT_MODEL:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-}
    volumes:
      - ./apps/llm_gateway:/app/apps/llm_gateway
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=3)",
        ]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- Backend service (MCP server management) -----------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: enterpriseai-backend
    container_name: enterpriseai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8002}:8002"
    env_file:
      - path: .env
        required: false
    environment:
      ENV: production
      DEBUG: "false"
      APP_NAME: EnterpriseAI Backend Service
      BACKEND_API_V1_PREFIX: /api/v1
      # Reuse the same database as auth service
      DATABASE_URL: ${AUTH_DATABASE_URL:-sqlite+aiosqlite:////data/auth.db}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]'
      # Share the same JWT settings as auth service
      JWT_ISSUER: enterprise-ai-auth
      JWT_AUDIENCE: enterprise-ai
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
    volumes:
      - ./data:/data  # Shared database with auth service
      - ./data/.keys:/app/apps/auth/.keys  # Shared RSA keypair with auth service
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)",
        ]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 15s

  # --- Optional: PostgreSQL (profile "postgres") ---------------------------
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: enterpriseai-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  redisdata:
