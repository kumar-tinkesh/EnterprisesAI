[project]
name = "enterprise-ai-auth"
version = "0.1.0"
description = "Universal standalone authentication service (FastAPI, SQLAlchemy 2.0, Argon2id, RS256 JWKS, OIDC SSO)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.21.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "email-validator>=2.2.0",
    "cryptography>=45.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "litellm>=1.98.0",
    "mcp>=2.1.1",
    "PyGithub>=2.1.0",
    "structlog>=25.1.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.8.0",
    "requests>=2.32.3",
    "pdfplumber>=0.11.4",
    "pypdf>=4.0.1,<6",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "redis>=5.2",
    "croniter>=2.0.5",
    "tzdata>=2025.2",
]

[dependency-groups]
# What the LLM gateway container needs (docker/Dockerfile.llm_gateway installs
# only this group); a plain `uv sync` still installs everything.
gateway = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "litellm>=1.98.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "import-linter>=2.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["apps/auth/tests", "apps/backend/vendor/tests", "apps/backend/user/tests", "apps/backend/knowledge/tests", "apps/backend/builder/tests", "apps/llm_gateway/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "apps/auth", "apps/backend", "apps/llm_gateway"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.importlinter]
root_packages = ["vendor", "user", "knowledge", "builder"]

[[tool.importlinter.contracts]]
name = "user must not import vendor's mutating/admin services"
type = "forbidden"
# Scoped to the non-test source tree: user.tests legitimately exercises
# vendor.services.mcp_service (via the shared apps/backend fixtures) as
# integration setup, which is not a production code dependency.
source_modules = ["user.api", "user.services"]
forbidden_modules = [
    "vendor.services.mcp_service",
    "vendor.services.mcp_client",
    "vendor.services.mcp_detect",
    "vendor.services.mcp_auth",
    "vendor.services.repo_analyzer",
    "vendor.services.oauth_flow",
    "vendor.api",
]

[[tool.importlinter.contracts]]
name = "vendor must never import from user"
type = "forbidden"
# Scoped to the non-test source tree: vendor.tests legitimately imports
# user.services.catalog_engine to test access-filtering end to end, which
# is not a production code dependency.
source_modules = ["vendor.api", "vendor.services", "vendor.models"]
forbidden_modules = ["user", "builder", "knowledge"]

[[tool.importlinter.contracts]]
name = "knowledge must not import vendor's mutating/admin services or user"
type = "forbidden"
# knowledge may reuse vendor.services.llm_gateway_client (the shared gateway
# singleton) for the optional gateway embedding backend, nothing else.
source_modules = ["knowledge.api", "knowledge.services", "knowledge.models"]
forbidden_modules = [
    "user",
    "builder",
    "vendor.api",
    "vendor.models",
    "vendor.services.mcp_service",
    "vendor.services.mcp_client",
    "vendor.services.mcp_detect",
    "vendor.services.mcp_auth",
    "vendor.services.repo_analyzer",
    "vendor.services.oauth_flow",
]

[[tool.importlinter.contracts]]
name = "builder may run tools but must not import vendor's admin API, detection or registration code"
type = "forbidden"
# builder needs vendor's connection services to *run* tools as a user:
# mcp_service.connection (build_runtime_config), mcp_service.crud (access
# check), mcp_client (sessions) and mcp_auth (credential presence). Import
# those submodules directly — the mcp_service package itself pulls in
# detection/registration code. Indirect imports are allowed only because
# vendor's own modules lazily re-import their package (for test
# monkeypatching), which links every mcp_service submodule to the rest;
# builder's own direct imports are what this contract polices.
allow_indirect_imports = true
source_modules = ["builder.api", "builder.services"]
forbidden_modules = [
    "vendor.api",
    "vendor.services.mcp_detect",
    "vendor.services.repo_analyzer",
    "vendor.services.oauth_flow",
    "vendor.services.mcp_service.registration",
]
